# staging profile.
# Secrets come from environment variables; set DB_PASSWORD (and RABBITMQ_PASSWORD) before starting.
lis:
  instruments:
    - name: OrthoVision
      port: 9001
      driverClassName: com.lis.astm.server.driver.impl.OrthoVisionDriver
      enabled: true
      orderQueueName: ortho-vision.orders.queue
      resultQueueName: ortho-vision.results.queue
      resultsRoutingKey: result.inbound
      exchangeName: ortho-vision-exchange

    - name: SysmexXN
      port: 5000
      driverClassName: com.lis.astm.server.driver.impl.SysmexXnDriver
      enabled: ${SYSMEX_XN_ENABLED:true}
      orderQueueName: sysmex-xn.orders.queue
      resultQueueName: sysmex-xn.results.queue
      resultsRoutingKey: result.inbound
      exchangeName: sysmex-xn-exchange

  messaging:
    enabled: true
    retry:
      batch-size: 5
      max-attempts: 3
      collision-delay-minutes: 2
      connection-delay-minutes: 5
      schedule-interval-ms: 60000

log_path: ${LOG_PATH:E:/astm-interface-services-data/logs}

spring:
  datasource:
    url: jdbc:sqlserver://${DB_HOST:10.200.0.43}:1433;databaseName=${DB_NAME:infinity-lis-staging};trustServerCertificate=true
    username: ${DB_USERNAME:kpmduser}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximumPoolSize: 5
      connectionTimeout: 180000
      leakDetectionThreshold: 10000
      poolName: Hikaripool_ASTM

  task:
    scheduling:
      pool:
        size: 2

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8084
