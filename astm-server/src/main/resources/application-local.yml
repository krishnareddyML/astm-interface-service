# Local development profile.
# Secrets come from environment variables; set DB_PASSWORD before starting.
lis:
  instruments:
    - name: OrthoVision
      port: 9001
      driverClassName: com.lis.astm.server.driver.impl.OrthoVisionDriver
      enabled: true
      orderQueueName: lis.orders.instrument.astm.outbound.q
      resultQueueName: lis.results.instrument.inbound.q
      resultsRoutingKey: results.instrument.astm
      qcRoutingKey: qc.instrument.astm
      queryRoutingKey: results.instrument.astm.query
      exchangeName: lis.inbound.x

    # Sysmex XN series hematology analyzer (ASTM E1381-02 / E1394-97 mode over TCP).
    # The IPU connects to this host on the port below (IPU default 5000).
    - name: SysmexXN
      port: 5000
      driverClassName: com.lis.astm.server.driver.impl.SysmexXnDriver
      enabled: true
      orderQueueName: lis.orders.instrument.astm.outbound.q
      resultQueueName: lis.results.instrument.inbound.q
      resultsRoutingKey: results.instrument.astm
      qcRoutingKey: qc.instrument.astm
      queryRoutingKey: results.instrument.astm.query
      exchangeName: lis.inbound.x

  messaging:
    enabled: true
    # Standard topology is provisioned by infinity-lis-rabbitmq-topology.ps1; the astm-server
    # user has no configure permission, so the service must not declare anything.
    declare-topology: false
    retry:
      batch-size: 5
      max-attempts: 3
      collision-delay-minutes: 2
      connection-delay-minutes: 5
      schedule-interval-ms: 60000

log_path: ${LOG_PATH:D:/astm-interface-services-data/logs}

spring:
  datasource:
    url: jdbc:sqlserver://${DB_HOST:192.168.20.123}:1433;databaseName=${DB_NAME:infinity-lis-shard-1};trustServerCertificate=true
    username: ${DB_USERNAME:medsa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximumPoolSize: 5
      connectionTimeout: 180000
      leakDetectionThreshold: 10000
      poolName: Hikaripool_ASTM

  task:
    scheduling:
      pool:
        size: 2

  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.20.254}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:infinity-lis-dev}
    username: ${RABBITMQ_USERNAME:astm-server}
    password: ${RABBITMQ_PASSWORD}

server:
  port: 8080
