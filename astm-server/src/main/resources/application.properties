# Application Information
spring.application.name=astm-interface-service
# Default Active Profile (override with SPRING_PROFILES_ACTIVE or -Dspring.profiles.active=...)
spring.profiles.active=local

# Secrets and site-specific overrides belong OUTSIDE the repository.
# Spring Boot automatically loads ./config/application-<profile>.yml next to the jar,
# so put database / RabbitMQ credentials there or in environment variables
# (DB_USERNAME, DB_PASSWORD, RABBITMQ_USERNAME, RABBITMQ_PASSWORD).

# Common Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.level.com.lis.astm=INFO
logging.level.com.zaxxer.hikari=WARN

# Debug consumer that logs everything published to the first instrument's result queue.
# Keep it off unless you are debugging locally: it competes with the LIS for messages.
lis.messaging.test-listener-enabled=false

# Common RabbitMQ Configuration
spring.rabbitmq.virtual-host=/
spring.rabbitmq.connection-timeout=30s
spring.rabbitmq.requested-heartbeat=60s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.receive-timeout=30s
spring.rabbitmq.template.reply-timeout=30s
