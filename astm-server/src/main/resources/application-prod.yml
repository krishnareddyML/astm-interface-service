# Production profile.
# All secrets MUST be provided through environment variables (no defaults here):
#   ASTM_DB_HOST, ASTM_DB_NAME, ASTM_DB_USERNAME, ASTM_DB_PASSWORD (DB_* also accepted)
#   RABBITMQ_HOST, RABBITMQ_PORT, RABBITMQ_VHOST, RABBITMQ_USERNAME, RABBITMQ_PASSWORD
# Spring profile YAML lists are replaced, not merged, so every instrument must be fully
# described here (name, port, driverClassName and queue settings).
lis:
  instruments:
    - name: OrthoVision
      port: ${ORTHO_VISION_PORT:9001}
      driverClassName: com.lis.astm.server.driver.impl.OrthoVisionDriver
      enabled: ${ORTHO_VISION_ENABLED:true}
      orderQueueName: lis.orders.instrument.astm.outbound.q
      resultQueueName: lis.results.instrument.inbound.q
      resultsRoutingKey: results.instrument.astm
      qcRoutingKey: qc.instrument.astm
      queryRoutingKey: results.instrument.astm.query
      exchangeName: lis.inbound.x

    - name: SysmexXN
      port: ${SYSMEX_XN_PORT:5000}
      driverClassName: com.lis.astm.server.driver.impl.SysmexXnDriver
      enabled: ${SYSMEX_XN_ENABLED:false}
      orderQueueName: lis.orders.instrument.astm.outbound.q
      resultQueueName: lis.results.instrument.inbound.q
      resultsRoutingKey: results.instrument.astm
      qcRoutingKey: qc.instrument.astm
      queryRoutingKey: results.instrument.astm.query
      exchangeName: lis.inbound.x

  messaging:
    enabled: true
    # Standard topology is provisioned by infinity-lis-rabbitmq-topology.ps1; the astm-server
    # user has no configure permission, so the service must not declare anything.
    declare-topology: false
    retry:
      batch-size: 20
      max-attempts: 10
      collision-delay-minutes: 30
      connection-delay-minutes: 60
      schedule-interval-ms: 300000

log_path: ${LOG_PATH:D:/astm-interface-services-data/logs}

spring:
  datasource:
    url: jdbc:sqlserver://${ASTM_DB_HOST:${DB_HOST}}:1433;databaseName=${ASTM_DB_NAME:${DB_NAME:infinity-lis-astm-prod}};encrypt=true;trustServerCertificate=false
    username: ${ASTM_DB_USERNAME:${DB_USERNAME}}
    password: ${ASTM_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 60000

  task:
    scheduling:
      pool:
        size: 5

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:infinity-lis-prod}
    username: ${RABBITMQ_USERNAME:astm-server}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 60s
    requested-heartbeat: 30s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /astm-interface
