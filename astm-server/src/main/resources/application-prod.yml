# Production profile.
# All secrets MUST be provided through environment variables (no defaults here):
#   DB_HOST, DB_NAME, DB_USERNAME, DB_PASSWORD
#   RABBITMQ_HOST, RABBITMQ_PORT, RABBITMQ_USERNAME, RABBITMQ_PASSWORD
# Spring profile YAML lists are replaced, not merged, so every instrument must be fully
# described here (name, port, driverClassName and queue settings).
lis:
  instruments:
    - name: OrthoVision
      port: ${ORTHO_VISION_PORT:9001}
      driverClassName: com.lis.astm.server.driver.impl.OrthoVisionDriver
      enabled: ${ORTHO_VISION_ENABLED:true}
      orderQueueName: ortho-vision.orders.queue
      resultQueueName: ortho-vision.results.queue
      resultsRoutingKey: result.inbound
      exchangeName: ortho-vision-exchange

    - name: SysmexXN
      port: ${SYSMEX_XN_PORT:5000}
      driverClassName: com.lis.astm.server.driver.impl.SysmexXnDriver
      enabled: ${SYSMEX_XN_ENABLED:false}
      orderQueueName: sysmex-xn.orders.queue
      resultQueueName: sysmex-xn.results.queue
      resultsRoutingKey: result.inbound
      exchangeName: sysmex-xn-exchange

  messaging:
    enabled: true
    retry:
      batch-size: 20
      max-attempts: 10
      collision-delay-minutes: 30
      connection-delay-minutes: 60
      schedule-interval-ms: 300000

log_path: ${LOG_PATH:D:/astm-interface-services-data/logs}

spring:
  datasource:
    url: jdbc:sqlserver://${DB_HOST}:1433;databaseName=${DB_NAME:ASTM_Interface_Prod};encrypt=true;trustServerCertificate=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 60000

  task:
    scheduling:
      pool:
        size: 5

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 60s
    requested-heartbeat: 30s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /astm-interface
